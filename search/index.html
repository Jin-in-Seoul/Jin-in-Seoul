<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <title>Search - Jin-in-Seoul</title>
  <meta name="description" content="Search the published fiction archive of Jin-in-Seoul in English, French, Japanese, and Korean.">
  <link rel="canonical" href="https://jin-in-seoul.com/search/">
  <link rel="stylesheet" href="/assets/style.css?v=046">
  <style>
    .search-container { max-width: 700px; margin-top: 44px; }
    .search-form { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .search-form input { flex: 1 1 270px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 2px; font: inherit; font-size: 17px; min-width: 0; }
    .search-form select, .search-form button { padding: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; font-size: 16px; }
    .search-form button { cursor: pointer; border-color: var(--ink); }
    .search-status { margin: 24px 0 20px; color: var(--muted); font-size: 15px; }
    .search-result { border-top: 1px solid var(--line); padding: 19px 0 23px; }
    .search-result h2 { font-size: 21px; border: 0; padding: 0; margin: 0 0 8px; }
    .search-result-meta { font-size: 13px; margin: 0 0 10px; color: var(--muted); }
    .search-result-excerpt { font-size: 16px; line-height: 1.65; margin: 0; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="shell">
    {% include header.html %}
    <h1>Search</h1>
    <div class="search-container">
      <p>Search published fiction by title or exact word / phrase. Results link to the corresponding language edition.</p>
      <form id="search-form" class="search-form" role="search">
        <label for="search-query" class="sr-only">Search text</label>
        <input id="search-query" type="search" placeholder="e.g. slow ship / 느린 배" aria-label="Search published works" required>
        <select id="search-language" aria-label="Language">
          <option value="all">All languages</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
        <button type="submit">Search</button>
      </form>
      <p id="search-status" class="search-status" role="status" aria-live="polite">Enter a word or phrase to search published works.</p>
      <div id="search-results"></div>
    </div>
    {% include footer.html %}
  </main>
  <script src="/assets/site-search.js?v=002" defer></script>
</body>
</html>
