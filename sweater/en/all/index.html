.complete-chapter:last-child{margin-bottom:0}
.complete-chapter>h2{font-size:clamp(26px,3vw,36px);line-height:1.35;margin:0 0 36px}

<main class="shell">
{% include header.html %}
<nav class="contents-nav" aria-label="Contents"><a href="/sweater/en/">Contents</a></nav>
<h1>Sweater</h1>
<div id="full-text"></div>
<div class="content-copyright" aria-label="Copyright and source" style="margin:0;padding:0;color:#777;font-size:12px;line-height:1.8;text-align:left;">

</div>
{% include footer.html %}
</main>
<script>
(async function(){
  const base='/sweater/en/';
  const output=document.getElementById('full-text');
  try{
    const response=await fetch(base,{cache:'no-cache'});
    if(!response.ok)throw new Error('Contents could not be loaded');
    const toc=new DOMParser().parseFromString(await response.text(),'text/html');
    const anchors=[...toc.querySelectorAll('.work-list a[href]')].filter(a=>/^chapter-\d{2}\/$/.test(a.getAttribute('href')||''));
    if(anchors.length!==12)throw new Error('Expected twelve chapters');
    const results=new Array(anchors.length);
    let next=0;
    async function worker(){
      while(next<anchors.length){
        const i=next++, a=anchors[i];
        const url=new URL(a.getAttribute('href'),new URL(base,location.origin));
        const res=await fetch(url,{cache:'no-cache'});
        if(!res.ok)throw new Error('Failed to load '+a.textContent);
        const html=new DOMParser().parseFromString(await res.text(),'text/html');
        const chapter=html.querySelector('section.prose.sweater-prose');
        if(!chapter)throw new Error('Chapter body missing: '+a.textContent);
        results[i]=chapter.innerHTML;
      }
    }
    await Promise.all(Array.from({length:Math.min(4,anchors.length)},()=>worker()));
    const fragment=document.createDocumentFragment();
    for(let i=0;i<anchors.length;i++){
      const container=document.createElement('section');
      container.className='complete-chapter';
      const heading=document.createElement('h2');
      heading.textContent=anchors[i].textContent.trim();
      container.appendChild(heading);
      const prose=document.createElement('section');
      prose.className='prose sweater-prose';
      prose.innerHTML=results[i];
      container.appendChild(prose);
      fragment.appendChild(container);
    }
    output.replaceChildren(fragment);
  }catch(error){output.textContent='Could not load the chapters: '+error.message;}
})();
</script>
</body>
