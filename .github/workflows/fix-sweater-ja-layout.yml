name: Fix Japanese Sweater layout
# retry 5

on:
  push:
    paths:
      - '.github/workflows/fix-sweater-ja-layout.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install beautifulsoup4 lxml weasyprint
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Rebuild Japanese PDF and EPUB
        run: python tools/fix_sweater_ja_layout.py
      - name: Verify PDF layout
        run: |
          pip install pymupdf
          python - <<'PY'
          import fitz,re
          p='assets/downloads/sweater/ja/sweater-ja-20261003-ver-001.pdf'
          d=fitz.open(p)
          assert len(d)>150
          # cover: free-edition text left near x=72
          r=d[0].search_for('無料デジタル版')
          assert r and 65 <= r[0].x0 <= 80 and 60 <= r[0].y0 <= 90, r
          # copyright title around English template y=228
          r=d[1].search_for('セーター')
          assert r and 210 <= r[0].y0 <= 250, r
          # TOC title around y=166
          r=d[2].search_for('目次')
          assert r and 145 <= r[0].y0 <= 185, r
          # first chapter date should be bold and followed by substantial vertical gap
          page=d[3]
          date=None
          for b in page.get_text('dict')['blocks']:
            for l in b.get('lines',[]):
              txt=''.join(s['text'] for s in l.get('spans',[])).strip()
              if re.match(r'^3月1日',txt):
                date=(l,txt)
                break
            if date: break
          assert date, 'first date not found'
          spans=date[0]['spans']
          print('date-fonts',[(s.get('font'),s.get('flags')) for s in spans])
          ydate=max(s['bbox'][3] for s in spans)
          candidates=[]
          for b in page.get_text('dict')['blocks']:
            for l in b.get('lines',[]):
              txt=''.join(s['text'] for s in l.get('spans',[])).strip()
              if txt and l['bbox'][1] > ydate+1:
                candidates.append((l['bbox'][1],txt))
          assert candidates and min(y for y,_ in candidates)-ydate >= 20, min(candidates)
          d.close()
          PY
      - name: Commit final files and remove helpers
        run: |
          rm -f tools/fix_sweater_ja_layout.py
          rm -f .github/workflows/fix-sweater-ja-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match Japanese Sweater layout to English edition"
          git push
