name: Rebuild Le Pull EPUB
on:
  push:
    paths:
      - '.github/workflows/rebuild-le-pull-epub.yml'
      - 'tools/rebuild_le_pull_epub.py'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 lxml
      - run: python tools/rebuild_le_pull_epub.py
      - name: Commit rebuilt EPUB and clean temporary audit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads/sweater/fr/le-pull-fr-20260930-ver-001.epub
          git rm -f \
            .github/workflows/rebuild-le-pull-epub.yml \
            tools/rebuild_le_pull_epub.py \
            .github/workflows/inspect-le-pull-epub.yml \
            tools/inspect_le_pull_epub.py \
            tools/le-pull-epub-inspect.txt || true
          git commit -m "Rebuild Le Pull EPUB from reviewed paragraph structure"
          git push
