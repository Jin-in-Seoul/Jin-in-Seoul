name: Refine weak SEO titles

on:
  push:
    paths:
      - '.github/workflows/refine-weak-seo-titles.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/refine_weak_seo_titles.py
      - name: Commit refined SEO titles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-weak-seo-titles.yml tools/refine_weak_seo_titles.py
          git add .
          git commit -m "Refine weak chapter SEO titles"
          git push
