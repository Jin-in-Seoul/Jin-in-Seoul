name: Download package audit
on:
  push:
    paths:
      - '.github/workflows/download-package-audit.yml'
      - 'tools/download_package_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python tools/download_package_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/download-audit.json
          git commit -m "Add temporary download package audit report"
          git push
