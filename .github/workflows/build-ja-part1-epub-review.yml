name: Build Japanese Part I EPUB review

on:
  push:
    paths:
      - '.github/workflows/build-ja-part1-epub-review.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 lxml
      - run: python tools/build_ja_part1_epub_review.py
      - uses: actions/upload-artifact@v4
        with:
          name: ja-part1-epub-review
          path: review-output/a-dictionary-of-galactic-extinction-part-01-ja-20261004-ver-001.epub
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-ja-part1-epub-review.yml tools/build_ja_part1_epub_review.py
          git commit -m "Remove temporary Japanese Part I EPUB builder"
          git push
