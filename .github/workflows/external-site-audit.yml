name: External site audit
on:
  push:
    paths:
      - '.github/workflows/external-site-audit.yml'
      - 'tools/external_site_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python tools/external_site_audit.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/site-audit-report.json
          git commit -m "Add temporary external site audit report"
          git push
