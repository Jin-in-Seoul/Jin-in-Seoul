name: Fix Korean Part I double indent
on:
  push:
    paths:
      - 'tools/fix_part1_ko_double_indent_20261004.py'
      - '.github/workflows/fix-part1-ko-double-indent-20261004.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum poppler-utils
          python -m pip install pymupdf reportlab pypdf
      - run: python tools/fix_part1_ko_double_indent_20261004.py
      - run: |
          KO=assets/downloads/a-dictionary-of-galactic-extinction/part-01/ko/a-dictionary-of-galactic-extinction-part-01-ko-20260929-ver-001.pdf
          mkdir -p /tmp/ko
          pdftoppm -f 22 -l 22 -png -r 140 "$KO" /tmp/ko/page >/dev/null 2>&1
          test "$(find /tmp/ko -name '*.png' | wc -l)" -eq 1
      - run: |
          rm -f tools/fix_part1_ko_double_indent_20261004.py
          rm -f .github/workflows/fix-part1-ko-double-indent-20261004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads/a-dictionary-of-galactic-extinction/part-01/ko/a-dictionary-of-galactic-extinction-part-01-ko-20260929-ver-001.pdf
          git add -u tools .github/workflows
          git commit -m "Remove duplicate indent in Korean Part I PDF"
          git push
