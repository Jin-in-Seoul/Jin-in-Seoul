name: One-time clean literary descriptions
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cleanup-descriptions.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Change descriptions only, with source protection
        run: |
          python3 scripts/one_time_clean_experimental_descriptions.py
          git diff --check
      - name: Commit audited metadata changes
        run: |
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "Nothing to update"
            exit 0
          fi
          echo "Changed HTML files:"
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove experimental genre label and show Book 1 of 10 in literary descriptions"
          git push origin HEAD:main
