name: Sweater PDF web audit
on:
  push:
    paths:
      - '.github/workflows/sweater-pdf-web-audit.yml'
      - 'tools/sweater_pdf_web_audit.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf beautifulsoup4
      - run: python tools/sweater_pdf_web_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sweater-pdf-web-audit.json
          git commit -m "Add temporary Sweater PDF web audit report"
          git push
