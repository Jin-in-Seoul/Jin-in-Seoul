name: Apply Galactic Extinction digital editions 2026-10-04

on:
  push:
    paths:
      - 'tools/apply_digital_editions_20261004.py'
      - '.github/workflows/apply-digital-editions-20261004.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf
      - name: Build PDFs and update site
        run: python tools/apply_digital_editions_20261004.py
      - name: Commit finished deployment
        run: |
          rm -f tools/apply_digital_editions_20261004.py
          rm -f .github/workflows/apply-digital-editions-20261004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Galactic Extinction Part II PDF editions"
          git push
