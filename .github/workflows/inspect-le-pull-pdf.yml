name: Inspect Le Pull PDF

on:
  push:
    paths:
      - '.github/workflows/inspect-le-pull-pdf.yml'
      - 'tools/inspect_le_pull_pdf.py'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - run: python tools/inspect_le_pull_pdf.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/le-pull-pdf-extract.txt
          git commit -m "Add temporary Le Pull PDF extraction report"
          git push
