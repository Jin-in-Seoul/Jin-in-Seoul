name: Restore Le Pull paragraphs from PDF

on:
  push:
    paths:
      - '.github/workflows/restore-le-pull-paragraphs.yml'
      - 'tools/restore_le_pull_paragraphs.py'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf beautifulsoup4
      - name: Restore PDF paragraph structure
        run: python tools/restore_le_pull_paragraphs.py
      - name: Commit restored French paragraphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/workflows/restore-le-pull-paragraphs.yml \
            tools/restore_le_pull_paragraphs.py \
            .github/workflows/inspect-le-pull-layout.yml \
            tools/inspect_le_pull_layout.py \
            tools/le-pull-layout-sample.txt \
            .github/workflows/inspect-le-pull-pdf.yml \
            tools/inspect_le_pull_pdf.py \
            tools/le-pull-pdf-extract.txt \
            .github/workflows/compare-le-pull-fast.yml \
            tools/compare_le_pull_fast.py \
            tools/le-pull-compare-fast.txt \
            .github/workflows/compare-le-pull.yml \
            tools/compare_le_pull.py || true
          git add sweater/fr
          git commit -m "Restore Le Pull paragraph structure from reviewed PDF"
          git push
