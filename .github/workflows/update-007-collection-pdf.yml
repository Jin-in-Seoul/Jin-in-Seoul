name: Update 007 collection PDF spacing

on:
  push:
    paths:
      - '.github/workflows/update-007-collection-pdf.yml'
      - 'tools/update_007_collection_pdf.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fontconfig
          pip install beautifulsoup4 weasyprint pymupdf
      - name: Rebuild revised PDF and update site text
        run: python tools/update_007_collection_pdf.py
      - name: Commit revised PDF and text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-007-collection-pdf.yml tools/update_007_collection_pdf.py
          git add assets/downloads/adjunct-lecturer-k-007-briefcase/ko/adjunct-lecturer-k-007-briefcase-ko-20261007-ver-001.pdf downloads/index.html publication-log/index.html
          git commit -m "Update 007 collection PDF paragraph spacing"
          git push
