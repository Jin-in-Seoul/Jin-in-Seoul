name: Finalize digital editions\n# retry 4

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-digital-editions.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          pip install beautifulsoup4 lxml reportlab pymupdf
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Finalize
        run: python tools/finalize_editions.py
      - name: Commit
        run: |
          rm -f tools/finalize_editions.py
          rm -f .github/workflows/finalize-digital-editions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize digital edition publishing standard"
          git push
