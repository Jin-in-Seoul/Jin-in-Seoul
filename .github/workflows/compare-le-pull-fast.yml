name: Fast compare Le Pull
on:
  push:
    paths:
      - '.github/workflows/compare-le-pull-fast.yml'
      - 'tools/compare_le_pull_fast.py'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf beautifulsoup4
      - run: python tools/compare_le_pull_fast.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add tools/le-pull-compare-fast.txt
          git commit -m "Add temporary fast Le Pull comparison report"
          git push
