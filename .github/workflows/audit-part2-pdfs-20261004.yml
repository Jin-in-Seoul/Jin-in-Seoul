name: Audit Part II PDFs
on:
  push:
    paths:
      - '.github/workflows/audit-part2-pdfs-20261004.yml'
permissions:
  contents: read
  actions: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p audit/en audit/ko
          EN="assets/downloads/a-dictionary-of-galactic-extinction/part-02/en/a-dictionary-of-galactic-extinction-part-02-en-20261004-ver-001.pdf"
          KO="assets/downloads/a-dictionary-of-galactic-extinction/part-02/ko/a-dictionary-of-galactic-extinction-part-02-ko-20261004-ver-001.pdf"
          pdftoppm -png -r 55 "$EN" audit/en/page >/dev/null 2>&1
          pdftoppm -png -r 55 "$KO" audit/ko/page >/dev/null 2>&1
          pdftotext "$EN" audit/en.txt
          pdftotext "$KO" audit/ko.txt
          pdfinfo "$EN" > audit/en-info.txt
          pdfinfo "$KO" > audit/ko-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: part2-pdf-full-audit
          path: audit
