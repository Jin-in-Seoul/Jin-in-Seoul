name: Fix Part II front colophons
on:
  push:
    paths:
      - 'tools/fix_part2_front_colophon_20261004.py'
      - '.github/workflows/fix-part2-front-colophon-20261004.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum poppler-utils
          python -m pip install reportlab pypdf
      - run: python tools/fix_part2_front_colophon_20261004.py
      - run: |
          mkdir -p /tmp/en /tmp/ko
          pdftoppm -f 1 -l 8 -png -r 72 assets/downloads/a-dictionary-of-galactic-extinction/part-02/en/a-dictionary-of-galactic-extinction-part-02-en-20261004-ver-001.pdf /tmp/en/page >/dev/null 2>&1
          pdftoppm -f 1 -l 8 -png -r 72 assets/downloads/a-dictionary-of-galactic-extinction/part-02/ko/a-dictionary-of-galactic-extinction-part-02-ko-20261004-ver-001.pdf /tmp/ko/page >/dev/null 2>&1
          test "$(find /tmp/en -name '*.png' | wc -l)" -eq 8
          test "$(find /tmp/ko -name '*.png' | wc -l)" -eq 8
      - run: |
          rm -f tools/fix_part2_front_colophon_20261004.py
          rm -f .github/workflows/fix-part2-front-colophon-20261004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match Part II PDF front matter to Part I"
          git push
