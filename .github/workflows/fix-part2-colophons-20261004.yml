name: Fix Part II colophon placement

on:
  push:
    paths:
      - 'tools/move_part2_colophons_20261004.py'
      - '.github/workflows/fix-part2-colophons-20261004.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf
      - run: python tools/move_part2_colophons_20261004.py
      - run: |
          rm -f tools/move_part2_colophons_20261004.py
          rm -f .github/workflows/fix-part2-colophons-20261004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move Part II colophons to final pages"
          git push
