name: Verify four maintenance utilities once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-maintenance-tools-once.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax for all four tools
        run: |
          python3 -m py_compile _maintenance/plan_release.py _maintenance/plan_gray_note_release.py _maintenance/check_change_scope.py _maintenance/report_site_status.py
          echo "PASS all four Python syntax checks"
      - name: Cross-collection planner self-test
        run: python3 _maintenance/plan_release.py --self-test
      - name: Change-scope checker self-test
        run: python3 _maintenance/check_change_scope.py --self-test
      - name: Gray Note planner isolated success and rejection checks
        run: |
          python3 - <<'PY'
          import sys, tempfile, pathlib
          sys.path.insert(0, str(pathlib.Path('_maintenance').resolve()))
          import plan_gray_note_release as mod
          with tempfile.TemporaryDirectory() as d:
              base=pathlib.Path(d); root=base/'checkout'; drafts=base/'drafts'
              root.mkdir(); drafts.mkdir()
              for p,s in {
                'gray-note/index.html':'<time datetime="2026-11-01T00:00:00+09:00">Nov</time>\n      <article class="gray-note-list-item">\n',
                'index.html':'<h1>Site</h1>\n',
                'sitemap.xml':'---\n---\n<urlset></urlset>\n',
                'publication-log/index.html':'<h2>November 1, 2026</h2>\n    <div class="publication-log">\n'
              }.items():
                  f=root/p;f.parent.mkdir(parents=True,exist_ok=True);f.write_text(s,encoding='utf8')
              route='/gray-note/999/en/'
              draft='---\n---\n<html lang="en"><head><link rel="canonical" href="https://jin-in-seoul.com'+route+'"><meta name="robots" content="index,follow"><link rel="alternate" hreflang="en" href="https://jin-in-seoul.com'+route+'"><link rel="alternate" hreflang="x-default" href="https://jin-in-seoul.com'+route+'"></head><body><article class="gray-note-post"><h1>Test</h1></article></body></html>'
              (drafts/'en.html').write_text(draft,encoding='utf8')
              spec={'number':'999','date':'2026-11-28','title':'Validation Fixture','editions':{'en':'en.html'}}
              changes=mod.plan(root,spec,drafts)
              assert set(changes)=={'gray-note/999/en/index.html','gray-note/index.html','sitemap.xml','publication-log/index.html'},list(changes)
              assert not (root/'gray-note/999').exists(),'read-only violation'
              print('PASS Gray Note success proposal: 4 expected changes, no repository modification')
              (root/'gray-note/999').mkdir(parents=True)
              try:
                  mod.plan(root,spec,drafts)
              except ValueError:
                  print('PASS Gray Note existing entry correctly rejected')
              else:
                  raise AssertionError('Existing entry not rejected')
          PY
      - name: Site status reporter live read-only test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 _maintenance/report_site_status.py > /tmp/maintenance-status.txt
          grep -q '^# Jin-in-Seoul maintenance status' /tmp/maintenance-status.txt
          grep -q 'Pages deployment' /tmp/maintenance-status.txt
          grep -q 'SEO source' /tmp/maintenance-status.txt
          grep -q 'Read-only collection; no files or workflows changed.' /tmp/maintenance-status.txt
          cat /tmp/maintenance-status.txt
          echo 'PASS status report returned expected structure'
