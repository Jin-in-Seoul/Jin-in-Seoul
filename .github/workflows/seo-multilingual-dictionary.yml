name: SEO multilingual dictionary

on:
  push:
    paths:
      - '.github/workflows/seo-multilingual-dictionary.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 lxml
      - run: python tools/seo_multilingual_dictionary.py
      - name: Commit SEO updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/seo-multilingual-dictionary.yml tools/seo_multilingual_dictionary.py
          git add a-dictionary-of-galactic-extinction
          git commit -m "Add multilingual SEO metadata to Galactic Extinction"
          git push
