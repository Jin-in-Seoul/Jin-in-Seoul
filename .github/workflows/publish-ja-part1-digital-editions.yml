name: Publish Japanese Part I digital editions

on:
  push:
    paths:
      - '.github/workflows/publish-ja-part1-digital-editions.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install beautifulsoup4 lxml weasyprint pymupdf
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Build and update site
        run: python tools/publish_ja_part1_digital_editions.py
      - name: Commit final files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-ja-part1-digital-editions.yml tools/publish_ja_part1_digital_editions.py
          git add assets/downloads/a-dictionary-of-galactic-extinction/part-01/ja downloads/index.html publication-log/index.html sitemap.xml
          git commit -m "Publish Japanese Part I PDF and EPUB"
          git push
