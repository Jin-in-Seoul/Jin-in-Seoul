name: SEO source audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.md'
      - 'sitemap.xml'
      - 'robots.txt'
      - '_config.yml'
      - 'scripts/audit_seo.py'
      - '.github/workflows/seo-audit.yml'

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only SEO audit
        run: python3 scripts/audit_seo.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-report
          path: seo-audit-report.md
          if-no-files-found: warn
