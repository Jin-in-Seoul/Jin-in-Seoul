name: Fine tune Sweater French structure

on:
  push:
    paths:
      - '.github/workflows/fine-tune-sweater-fr-structure.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: pip install beautifulsoup4 lxml
      - name: Fine tune French structure
        run: python tools/fine_tune_sweater_fr_structure.py
      - name: Verify scope
        run: |
          python - <<'PY'
          import subprocess
          out=subprocess.check_output(['git','status','--short'],text=True)
          changed=[line[3:] for line in out.splitlines() if line.strip()]
          bad=[p for p in changed if not p.startswith('sweater/fr/chapter-')]
          if bad:
              raise SystemExit('Unexpected changed files: '+repr(bad))
          print('\n'.join(changed))
          PY
      - name: Commit and clean helpers
        run: |
          rm -f tools/fine_tune_sweater_fr_structure.py
          rm -f .github/workflows/fine-tune-sweater-fr-structure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Le Pull diary structure with Korean master"
          git push
