name: Fix Part I chapter 5 EPUBs
on:
  push:
    paths:
      - 'tools/fix_part1_ch05_epub_20261004.py'
      - '.github/workflows/fix-part1-ch05-epubs-20261004.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and validate EPUBs
        run: python tools/fix_part1_ch05_epub_20261004.py
      - name: Commit corrected EPUBs
        run: |
          rm -f tools/fix_part1_ch05_epub_20261004.py
          rm -f .github/workflows/fix-part1-ch05-epubs-20261004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/downloads/a-dictionary-of-galactic-extinction/part-01/ko/a-dictionary-of-galactic-extinction-part-01-ko-20260929-ver-001.epub
          git add assets/downloads/a-dictionary-of-galactic-extinction/part-01/en/a-dictionary-of-galactic-extinction-part-01-en-20260929-ver-001.epub
          git add -u tools .github/workflows
          git commit -m "Correct Part I chapter 5 EPUBs"
          git push
