name: Rebuild Part II colophons

on:
  push:
    paths:
      - 'tools/rebuild_part2_colophons_20261004.py'
      - '.github/workflows/rebuild-part2-colophons-20261004.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf
      - run: python tools/rebuild_part2_colophons_20261004.py
      - run: |
          rm -f tools/rebuild_part2_colophons_20261004.py
          rm -f .github/workflows/rebuild-part2-colophons-20261004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct Part II colophons"
          git push
