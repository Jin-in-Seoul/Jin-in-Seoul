name: Apply novel book paragraph style

on:
  push:
    paths:
      - '.github/workflows/apply-novel-book-style.yml'
      - 'tools/apply_novel_book_style.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Sweater and Scarecrow Distance styles
        run: python tools/apply_novel_book_style.py
      - name: Commit style update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-novel-book-style.yml tools/apply_novel_book_style.py
          git add assets/style.css sweater scarecrow-distance
          git commit -m "Apply book-style paragraph formatting to Sweater and Scarecrow Distance"
          git push
