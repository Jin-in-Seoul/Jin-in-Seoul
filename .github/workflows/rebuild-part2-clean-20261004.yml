name: Clean rebuild Part II PDFs

on:
  push:
    paths:
      - 'tools/rebuild_part2_clean_20261004.py'
      - '.github/workflows/rebuild-part2-clean-20261004.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum poppler-utils
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf
      - name: Rebuild and validate
        run: python tools/rebuild_part2_clean_20261004.py
      - name: Render front and final pages for smoke test
        run: |
          mkdir -p /tmp/check-en /tmp/check-ko
          pdftoppm -f 1 -l 7 -png -r 72 assets/downloads/a-dictionary-of-galactic-extinction/part-02/en/a-dictionary-of-galactic-extinction-part-02-en-20261004-ver-001.pdf /tmp/check-en/page >/dev/null 2>&1
          pdftoppm -f 1 -l 7 -png -r 72 assets/downloads/a-dictionary-of-galactic-extinction/part-02/ko/a-dictionary-of-galactic-extinction-part-02-ko-20261004-ver-001.pdf /tmp/check-ko/page >/dev/null 2>&1
          test "$(find /tmp/check-en -name '*.png' | wc -l)" -eq 7
          test "$(find /tmp/check-ko -name '*.png' | wc -l)" -eq 7
      - name: Commit PDFs
        run: |
          rm -f tools/rebuild_part2_clean_20261004.py
          rm -f .github/workflows/rebuild-part2-clean-20261004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Galactic Extinction Part II PDFs cleanly"
          git push
