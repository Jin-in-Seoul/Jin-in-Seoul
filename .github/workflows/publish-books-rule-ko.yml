name: Publish Books Rule Korean

on:
  push:
    paths:
      - '.github/workflows/publish-books-rule-ko.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/publish_books_rule_ko.py
      - name: Commit publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-books-rule-ko.yml tools/publish_books_rule_ko.py
          git add .
          git commit -m "Publish Korean edition of Books Rule"
          git push
