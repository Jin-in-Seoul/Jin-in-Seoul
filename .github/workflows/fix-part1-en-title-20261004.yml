name: Fix English Part I title page

on:
  push:
    paths:
      - 'tools/fix_part1_en_title_20261004.py'
      - '.github/workflows/fix-part1-en-title-20261004.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf
      - run: python tools/fix_part1_en_title_20261004.py
      - run: |
          rm -f tools/fix_part1_en_title_20261004.py
          rm -f .github/workflows/fix-part1-en-title-20261004.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix English Part I title-page placement"
          git push
