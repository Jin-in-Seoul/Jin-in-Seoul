name: Compare Le Pull PDF and site
on:
  push:
    paths:
      - '.github/workflows/compare-le-pull.yml'
      - 'tools/compare_le_pull.py'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf beautifulsoup4
      - run: python tools/compare_le_pull.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/le-pull-compare-report.txt
          git commit -m "Add temporary Le Pull comparison report"
          git push
