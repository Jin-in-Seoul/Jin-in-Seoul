<!doctype html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-72EG8XPTN7"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-72EG8XPTN7');</script>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 보기 - 은하 멸망 사전 - Jin-in-Seoul</title>
<meta name="description" content="『은하 멸망 사전』 한국어판에 게시된 모든 항목을 한 페이지에서 읽습니다.">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="../../../assets/style.css?v=051">
<style>
.full-part{margin:70px 0 38px;font-size:clamp(26px,3vw,36px);line-height:1.35}
.full-entry{margin:0 0 76px}
.full-entry h3{font-size:clamp(25px,2.8vw,34px);line-height:1.35;margin:0 0 32px}
.full-entry .prose{margin-top:0}
@media(max-width:620px){.full-entry{margin-bottom:58px}}

/* 제5부 기록물 서식은 개별 장의 CSS를 동적으로 적용합니다. */
</style>
</head>
<body>
<main class="shell">
{% include header.html %}
<nav class="contents-nav" aria-label="목차"><a href="/a-dictionary-of-galactic-extinction/ko/">목차</a></nav>
<h1>은하 멸망 사전</h1>
<div id="full-text"></div>
{% include footer.html %}
</main>
<script>
(async function(){
  const base='/a-dictionary-of-galactic-extinction/ko/';
  const root=document.getElementById('full-text');
  try{
    const tocResponse=await fetch(base,{cache:'no-cache'});
    if(!tocResponse.ok)throw new Error('목차를 가져오지 못했습니다.');
    const toc=new DOMParser().parseFromString(await tocResponse.text(),'text/html');
    const sections=Array.from(toc.querySelectorAll('.toc-part'));
    const groups=sections.map(section=>({
      title:section.querySelector('h2')?.textContent.trim()||'',
      entries:Array.from(section.querySelectorAll('ol a[href]')).filter(a=>/^part-\d+\/entry-\d+\/$/.test(a.getAttribute('href')||'')).map(a=>({title:a.textContent.trim(),url:new URL(a.getAttribute('href'),new URL(base,window.location.origin)).href}))
    })).filter(group=>group.entries.length);
    const entries=groups.flatMap(group=>group.entries);
    if(!entries.length)throw new Error('게시된 항목이 없습니다.');
    const results=new Array(entries.length);
    let next=0;
    async function worker(){
      while(next<entries.length){
        const i=next++;
        const response=await fetch(entries[i].url,{cache:'no-cache'});
        if(!response.ok)throw new Error(entries[i].title+' 항목을 불러올 수 없습니다.');
        const doc=new DOMParser().parseFromString(await response.text(),'text/html');
        const article=doc.querySelector('article.prose');
        if(!article)throw new Error(entries[i].title+' 항목의 본문을 찾을 수 없습니다.');
        results[i]={html:article.innerHTML,recordStyle:entries[i].url.includes('/part-05/')?Array.from(doc.querySelectorAll('head style')).map(el=>el.textContent).join('\n'):''};
      }
    }
    await Promise.all(Array.from({length:Math.min(6,entries.length)},()=>worker()));
    let i=0;
    for(const group of groups){
      const heading=document.createElement('h2');
      heading.className='full-part';heading.textContent=group.title;root.appendChild(heading);
      for(const [entryIndex,entry] of group.entries.entries()){
        const section=document.createElement('section');section.className='full-entry';
        if(entry.url.includes('/part-05/')){
          section.classList.add('part-05');
          const match=entry.url.match(/\/entry-(\d+)\//);
          if(match)section.classList.add('entry-'+match[1]);
        }
        const h3=document.createElement('h3');h3.textContent=(entryIndex+1)+'. '+entry.title;section.appendChild(h3);
        const article=document.createElement('article');article.className='prose galactic-prose';
        const result=results[i++];
        article.innerHTML=result.html;section.appendChild(article);root.appendChild(section);
        if(result.recordStyle){
          const scoped=document.createElement('style');
          scoped.textContent='@scope (.full-entry.part-05.entry-'+String(entryIndex+1).padStart(2,'0')+') {\n'+result.recordStyle+'\n}';
          root.appendChild(scoped);
        }
      }
    }


    // The appendix is a stand-alone source and follows the five numbered parts.
    const appendixHref=toc.querySelector('a[href="appendix/"]');
    if(appendixHref){
      const appendixUrl=new URL(appendixHref.getAttribute('href'),new URL(base,window.location.origin));
      const appendixResponse=await fetch(appendixUrl,{cache:'no-cache'});
      if(!appendixResponse.ok)throw new Error('부록을 불러오지 못했습니다.');
      const appendixDoc=new DOMParser().parseFromString(await appendixResponse.text(),'text/html');
      const appendixArticle=appendixDoc.querySelector('article.appendix-content');
      if(!appendixArticle)throw new Error('부록 본문을 찾을 수 없습니다.');
      const appendixHeading=document.createElement('h2');
      appendixHeading.className='full-part';
      appendixHeading.textContent='부록';
      root.appendChild(appendixHeading);
      const appendixSection=document.createElement('section');
      appendixSection.className='full-entry appendix';
      const appendixTitle=document.createElement('h3');
      appendixTitle.textContent='은하에서 길 잃은 자를 위한 색인';
      appendixSection.appendChild(appendixTitle);
      const appendixBody=document.createElement('article');
      appendixBody.className='prose galactic-prose appendix-content';
      appendixBody.innerHTML=appendixArticle.innerHTML;
      appendixSection.appendChild(appendixBody);
      root.appendChild(appendixSection);
      const appendixStyle=document.createElement('style');
      appendixStyle.textContent='@scope (.full-entry.appendix) {\n'+Array.from(appendixDoc.querySelectorAll('head style')).map(el=>el.textContent).join('\n')+'\n}';
      root.appendChild(appendixStyle);
    }

  }catch(err){root.replaceChildren();root.textContent='전체 보기를 불러오지 못했습니다: '+err.message}
})();
</script>
</body>
</html>
