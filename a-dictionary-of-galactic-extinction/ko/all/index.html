<!doctype html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-72EG8XPTN7"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-72EG8XPTN7');</script>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전체 보기 - 은하 멸망 사전 - Jin-in-Seoul</title>
<meta name="description" content="『은하 멸망 사전』 한국어판에 게시된 모든 항목을 한 페이지에서 읽습니다.">
<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="../../../assets/style.css?v=051">
<style>
.full-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:24px 0 44px}
.full-action{display:inline-block;padding:14px 22px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:16px;text-decoration:none;cursor:pointer}
.full-action:hover{border-color:var(--ink)}
.full-action:disabled{opacity:.45;cursor:default}
.full-part{margin:70px 0 38px;font-size:clamp(26px,3vw,36px);line-height:1.35}
.full-entry{margin:0 0 76px}
.full-entry h3{font-size:clamp(25px,2.8vw,34px);line-height:1.35;margin:0 0 32px}
.full-status{color:var(--muted);margin:20px 0 36px}
.full-entry .prose{margin-top:0}
@media(max-width:620px){.full-actions{margin-bottom:32px}.full-entry{margin-bottom:58px}}
</style>
</head>
<body>
<main class="shell">
{% include header.html %}
<nav class="contents-nav" aria-label="목차"><a href="/a-dictionary-of-galactic-extinction/ko/">목차</a></nav>
<h1>은하 멸망 사전</h1>
<p class="deck">한국어판 · 전체 보기</p>
<div class="full-actions">
<a class="full-action" href="/a-dictionary-of-galactic-extinction/ko/">목차로 돌아가기</a>
<button class="full-action" id="copy-all" type="button" disabled>전체 복사</button>
</div>
<p id="full-status" class="full-status" role="status">게시된 항목을 불러오는 중입니다.</p>
<div id="full-text"></div>
{% include footer.html %}
</main>
<script>
(async function(){
  const base='/a-dictionary-of-galactic-extinction/ko/';
  const status=document.getElementById('full-status');
  const root=document.getElementById('full-text');
  const copy=document.getElementById('copy-all');
  try{
    const tocResponse=await fetch(base,{cache:'no-cache'});
    if(!tocResponse.ok)throw new Error('목차를 가져오지 못했습니다.');
    const toc=new DOMParser().parseFromString(await tocResponse.text(),'text/html');
    const sections=Array.from(toc.querySelectorAll('.toc-part'));
    const groups=sections.map(section=>({
      title:section.querySelector('h2')?.textContent.trim()||'',
      entries:Array.from(section.querySelectorAll('ol a[href]')).filter(a=>/^part-\d+\/entry-\d+\/$/.test(a.getAttribute('href')||'')).map(a=>({title:a.textContent.trim(),url:new URL(a.getAttribute('href'),base).href}))
    })).filter(group=>group.entries.length);
    const entries=groups.flatMap(group=>group.entries);
    if(!entries.length)throw new Error('게시된 항목이 없습니다.');
    const results=new Array(entries.length);
    let next=0;
    async function worker(){
      while(next<entries.length){
        const i=next++;
        const response=await fetch(entries[i].url,{cache:'no-cache'});
        if(!response.ok)throw new Error(entries[i].title+' 항목을 불러올 수 없습니다.');
        const doc=new DOMParser().parseFromString(await response.text(),'text/html');
        const article=doc.querySelector('article.prose');
        if(!article)throw new Error(entries[i].title+' 항목의 본문을 찾을 수 없습니다.');
        results[i]=article.innerHTML;
      }
    }
    await Promise.all(Array.from({length:Math.min(6,entries.length)},()=>worker()));
    let i=0;
    for(const group of groups){
      const heading=document.createElement('h2');
      heading.className='full-part';heading.textContent=group.title;root.appendChild(heading);
      for(const entry of group.entries){
        const section=document.createElement('section');section.className='full-entry';
        const h3=document.createElement('h3');h3.textContent=entry.title;section.appendChild(h3);
        const article=document.createElement('article');article.className='prose galactic-prose';
        article.innerHTML=results[i++];section.appendChild(article);root.appendChild(section);
      }
    }
    status.textContent='총 '+entries.length+'개 항목을 모두 불러왔습니다.';
    copy.disabled=false;
    copy.addEventListener('click',async()=>{
      let output='은하 멸망 사전\n\n';
      for(const child of root.children){
        if(child.tagName==='H2')output+='\n'+child.textContent+'\n\n';
        else{
          output+=child.querySelector('h3').textContent+'\n\n';
          const article=child.querySelector('article');
          for(const block of article.children){
            if(block.tagName==='UL'||block.tagName==='OL')output+=Array.from(block.querySelectorAll('li')).map(li=>'• '+li.innerText.trim()).join('\n')+'\n\n';
            else if(block.tagName==='DIV')output+=block.innerText.trim()+'\n\n';
            else output+=block.innerText.trim()+'\n\n';
          }
        }
      }
      try{await navigator.clipboard.writeText(output.trim());status.textContent='전체 원고를 복사했습니다.'}
      catch(e){status.textContent='자동 복사가 제한됐습니다. 페이지 본문을 직접 선택해 복사해 주세요.'}
    });
  }catch(err){root.replaceChildren();status.textContent='전체 보기를 완성하지 못했습니다: '+err.message}
})();
</script>
</body>
</html>
